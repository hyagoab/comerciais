name: Publicar agenda

on:
  push:
    branches: [main]
    paths: ["agenda/**"]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # a cada 10 min: coloca no site o que já foi ao ar
  workflow_dispatch:
    inputs:
      teste:
        description: "Só testar a chave da Zernio (não publica nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            agenda
            data
            scripts
      - name: Ver se há algo a fazer
        id: fila
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,glob
          from datetime import datetime,timezone
          n=0
          for p in glob.glob('agenda/*.json'):
              i=json.load(open(p))
              s=i.get('status')
              if s=='agendado' or (s=='programado' and datetime.fromisoformat(i['publicar_em'])<=datetime.now(timezone.utc)): n+=1
          print(f"pendentes={n}")
          PY
      - name: Publicar
        if: steps.fila.outputs.pendentes != '0' || github.event_name == 'workflow_dispatch'
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.teste }}" = "true" ]; then python3 scripts/publicar.py --teste; else python3 scripts/publicar.py; fi
      - name: Gravar resultado
        if: always() && steps.fila.outputs.pendentes != '0'
        run: |
          git config user.name "robo-hyago"
          git config user.email "robo-hyago@users.noreply.github.com"
          git add agenda data
          git diff --cached --quiet || (git commit -m "Robô: agenda atualizada" && git pull --rebase && git push)
